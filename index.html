let SEM = null, IDX = {}, INV = {}, loading = {}, C2T = null, T2C = null;

function loadSearch(lang) {
  const need = [];
  if (!SEM && !loading.sem) {
    loading.sem = 1;
    need.push(fetch('search-sem.json').then(r => r.ok ? r.json() : null)
      .then(j => { SEM = j || { concepts: {}, pageTopics: {}, queries: [] }; buildConceptLookup(); })
      .catch(() => { SEM = { concepts: {}, pageTopics: {}, queries: [] }; buildConceptLookup(); }));
  }
  if (!IDX[lang] && !loading[lang]) {
    loading[lang] = 1;
    need.push(fetch('search-' + lang + '.json').then(r => r.ok ? r.json() : null)
      .then(j => { if (j) { IDX[lang] = j; INV[lang] = buildInverted(j); } }).catch(() => {}));
  }
  return need.length ? Promise.all(need).catch(() => {}) : Promise.resolve();
}

function buildInverted(pages) {
  const inv = new Map(), dl = [];
  pages.forEach((txt, i) => {
    const ts = stems(txt); dl[i] = ts.length || 1;
    const tf = new Map(); ts.forEach(t => tf.set(t, (tf.get(t) || 0) + 1));
    tf.forEach((n, t) => { if (!inv.has(t)) inv.set(t, new Map()); inv.get(t).set(i, n); });
  });
  return { inv, dl, N: pages.length, avg: dl.reduce((a, b) => a + b, 0) / (pages.length || 1),
           vocab: Array.from(inv.keys()) };
}

function buildConceptLookup() {
  C2T = new Map(); T2C = new Map();
  const cs = (SEM && SEM.concepts) || {};
  Object.keys(cs).forEach(slug => {
    const set = new Set();
    (cs[slug] || []).forEach(term => stems(term, true).forEach(st => {
      set.add(st);
      if (!T2C.has(st)) T2C.set(st, new Set());
      T2C.get(st).add(slug);
    }));
    C2T.set(slug, set);
  });
}

/* Expand a raw query into weighted stems, concepts, and any matched intent */
function expand(raw, lang) {
  const qStems = stems(raw), qRaw = DEACC(raw).trim();
  const weights = new Map(), concepts = new Set();
  const add = (st, w) => { if (st && (!weights.has(st) || weights.get(st) < w)) weights.set(st, w); };
  qStems.forEach(st => add(st, 1));

  if (!C2T) buildConceptLookup();
  const inv = INV[lang], corrected = [];
  /* correct against page vocabulary AND concept vocabulary, so a term that exists
     only in the other language can still be reached through its concept */
  if (!expand._vocab || expand._vocabLang !== lang) {
    const v = new Set((inv && inv.vocab) || []);
    T2C.forEach((_, st) => v.add(st));
    expand._vocab = Array.from(v); expand._vocabLang = lang;
  }
  const vocab = expand._vocab;
  {
    qStems.forEach(st => {
      const known = (inv && inv.inv.has(st)) || T2C.has(st);
      if (!known && st.length >= 4) {
        const max = st.length > 6 ? 2 : 1;
        let best = null, bd = max + 1;
        for (let k = 0; k < vocab.length; k++) {
          const v = vocab[k];
          if (Math.abs(v.length - st.length) > max) continue;
          const d = editLE(st, v, max);
          if (d < bd) { bd = d; best = v; if (d === 1) break; }
        }
        if (best) { add(best, 0.75); corrected.push([st, best]); }
      }
    });
  }

  qStems.forEach(st => (T2C.get(st) || []).forEach(slug => concepts.add(slug)));
  corrected.forEach(pair => (T2C.get(pair[1]) || []).forEach(slug => concepts.add(slug)));

  let intent = null, bestSim = 0;
  const qset = new Set(qStems);
  ((SEM && SEM.queries) || []).forEach(e => {
    const es = stems(e.q); if (!es.length) return;
    let hit = 0; es.forEach(t => { if (qset.has(t)) hit++; });
    const sim = hit / Math.max(es.length, qset.size || 1);
    if (sim > bestSim) { bestSim = sim; intent = e; }
  });
  if (!(intent && bestSim >= 0.6)) intent = null;
  if (intent) (intent.concepts || []).forEach(c => concepts.add(c));

  const df = st => { const p = inv && inv.inv.get(st); return p ? p.size / inv.N : 0; };
  concepts.forEach(slug => (C2T.get(slug) || new Set()).forEach(st => {
    if (st.length < 4) return;                 /* too short to be meaningful */
    if (df(st) > 0.3) return;                  /* appears everywhere: not discriminative */
    add(st, 0.25);
  }));
  return { weights: weights, concepts: concepts, corrected: corrected, intent: intent,
           qRaw: qRaw, qStems: qStems };
}

function scorePages(ex, lang) {
  const inv = INV[lang]; if (!inv) return [];
  const K1 = 1.4, B = 0.7, hits = new Map();
  ex.weights.forEach((w, st) => {
    const post = inv.inv.get(st); if (!post) return;
    const idf = Math.log(1 + (inv.N - post.size + 0.5) / (post.size + 0.5));
    post.forEach((tf, p) => {
      hits.set(p, (hits.get(p) || 0) +
        idf * (tf * (K1 + 1)) / (tf + K1 * (1 - B + B * inv.dl[p] / inv.avg)) * w);
    });
  });
  const topics = (SEM && SEM.pageTopics) || {};
  for (let p = 0; p < inv.N; p++) {
    const t = topics[String(p + 1)]; if (!t) continue;
    const bag = new Set();
    (t.en || []).concat(t.es || []).forEach(x => stems(x, true).forEach(st => bag.add(st)));
    let b = 0;
    ex.weights.forEach((w, st) => {
      if (!bag.has(st) || st.length < 4) return;
      const post = inv.inv.get(st);
      if (post && post.size / inv.N > 0.35) return;
      b += (w === 1 ? 3.2 : 1.5) * w;
    });
    if (b) hits.set(p, (hits.get(p) || 0) + b);
  }
  if (ex.intent && ex.intent.pages) {
    ex.intent.pages.forEach(p => hits.set(p - 1, (hits.get(p - 1) || 0) + 5));
  }
  const pages = IDX[lang] || [];
  if (ex.qRaw.length > 4) {
    pages.forEach((txt, p) => { if (DEACC(txt).indexOf(ex.qRaw) >= 0) hits.set(p, (hits.get(p) || 0) + 7); });
  }
  const own = ex.qStems.filter(st => ex.weights.get(st) === 1);
  const out = [];
  hits.forEach((sc, p) => {
    let c = 0;
    own.forEach(st => { const po = inv.inv.get(st); if (po && po.has(p)) c++; });
    if (own.length) sc *= (c === 0) ? 0.3 : (0.5 + 0.5 * (c / own.length));
    out.push({ page: p + 1, score: sc, text: pages[p] || '' });
  });
  out.sort((a, b) => b.score - a.score);
  if (!out.length) return out;
  const cut = Math.max(1.6, out[0].score * 0.42);
  return out.filter(h => h.score >= cut).slice(0, 14);
}

function scoreSummary(ex) {
  const res = [];
  document.querySelectorAll('#app section').forEach(sec => {
    const h2 = sec.querySelector('h2'), secName = h2 ? h2.textContent : '';
    const secBoost = (ex.intent && ex.intent.section && sec.id === ex.intent.section) ? 3 : 0;
    sec.querySelectorAll('p,li,h3,h4,summary,.pn,.pd,.pa,.pf,.sn,.sl,.means,.dt,.dd,.addr,.xp-body,.lead')
       .forEach(el => {
      if (el.querySelector('p,li,h3')) return;
      const t = (el.textContent || '').trim(); if (t.length < 3) return;
      const bag = new Map(); stems(t).forEach(st => bag.set(st, (bag.get(st) || 0) + 1));
      let sc = 0, own = 0;
      const headish = /^H[1-4]$/.test(el.tagName) || el.tagName === 'SUMMARY';
      ex.weights.forEach((w, st) => {
        const tf = bag.get(st); if (!tf) return;
        sc += w * (1 + Math.log(tf)) * (headish ? 2.2 : 1);
        if (w === 1) own++;
      });
      if (ex.qRaw.length > 3 && DEACC(t).indexOf(ex.qRaw) >= 0) sc += 6;
      if (!sc) return;
      const ownTotal = ex.qStems.filter(st => ex.weights.get(st) === 1).length || 1;
      sc *= (own === 0) ? 0.3 : (0.5 + 0.5 * Math.min(1, own / ownTotal));
      res.push({ el: el, sec: secName, text: t, score: sc + secBoost, own: own });
    });
  });
  res.sort((a, b) => b.score - a.score);
  if (!res.length) return res;
  /* if nothing literally matched the query, only keep a strong semantic hit —
     a weak concept-only match is noise, not an answer */
  if (!res.some(h => h.own > 0) && res[0].score < 3) return [];
  const cut = Math.max(1.1, res[0].score * 0.45);
  return res.filter(h => h.score >= cut).slice(0, 12);
}

function snippet(text, ex, len) {
  const td = DEACC(text);
  let i = ex.qRaw.length > 2 ? td.indexOf(ex.qRaw) : -1, mlen = ex.qRaw.length;
  if (i < 0) {
    const keys = Array.from(ex.weights.keys()).sort((a, b) => ex.weights.get(b) - ex.weights.get(a));
    for (let k = 0; k < keys.length; k++) {
      const p = td.indexOf(keys[k]);
      if (p >= 0) { i = p; mlen = keys[k].length; break; }
    }
  }
  if (i < 0) return esc(text.slice(0, len));
  const st0 = Math.max(0, i - Math.floor(len / 3));
  const cut = text.slice(st0, st0 + len), rel = i - st0;
  let tail = cut.slice(rel + mlen);
  const m = tail.match(/^[\wÀ-ɏ]+/);
  if (m) { mlen += m[0].length; tail = cut.slice(rel + mlen); }
  return (st0 > 0 ? '…' : '') + esc(cut.slice(0, rel)) + '<mark>' + esc(cut.slice(rel, rel + mlen))
       + '</mark>' + esc(tail) + (st0 + len < text.length ? '…' : '');
}

function goTo(el) {
  document.getElementById('results').classList.remove('on');
  let d = el.closest('details');
  while (d) { d.open = true; d = d.parentElement && d.parentElement.closest('details'); }
  scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + scrollY - 96), behavior: 'smooth' });
  el.classList.remove('flashhit'); void el.offsetWidth; el.classList.add('flashhit');
}

function runSearch() {
  const box = document.getElementById('results'), qEl = document.getElementById('q');
  if (!box || !qEl) return;
  const qv = ((qEl.value) || '').trim();
  const clr = document.getElementById('qClear');
  if (clr) clr.classList.toggle('on', qv.length > 0);
  if (qv.length < 2) { box.classList.remove('on'); box.innerHTML = ''; return; }
  const U = UIQ[LANG] || UIQ.en, ex = expand(qv, LANG);
  const sum = scoreSummary(ex), pg = scorePages(ex, LANG);
  let html = '';
  if (ex.corrected.length) {
    html += '<div class="rmore" style="padding-top:11px">' + esc(U.did) + ' <b>'
         + esc(ex.corrected.map(c => c[1]).join(' ')) + '</b></div>';
  }
  if (sum.length) {
    html += '<div class="rgroup">' + esc(U.inSummary) + ' · ' + sum.length + '</div>';
    sum.slice(0, 8).forEach((h, i) => {
      html += '<button type="button" class="ritem" data-i="' + i + '"><div class="rt">'
           + esc(h.sec) + '</div><div class="rs">' + snippet(h.text, ex, 150) + '</div></button>';
    });
    if (sum.length > 8) html += '<div class="rmore">+' + (sum.length - 8) + ' ' + esc(U.more) + '</div>';
  }
  box._hits = sum;
  if (pg.length) {
    html += '<div class="rgroup">' + esc(U.inPlan) + ' · ' + pg.length + '</div>';
    pg.slice(0, 10).forEach(h => {
      const href = planPageHref(h.page);
      html += '<a class="ritem" href="' + href + '"'
           
           + '><div class="rt">' + esc(U.page) + ' ' + h.page + '</div><div class="rs">'
           + snippet(h.text, ex, 150) + '</div></a>';
    });
    if (pg.length > 10) html += '<div class="rmore">+' + (pg.length - 10) + ' ' + esc(U.more) + '</div>';
  }
  if (!html) html = '<div class="rnone">' + esc(U.none) + '</div>';
  box.innerHTML = html; box.classList.add('on');
  box.querySelectorAll('button.ritem').forEach(btn => btn.addEventListener('click', function () {
    const h = box._hits[+btn.dataset.i]; if (h) goTo(h.el);
  }));
}

let qTimer;
function wireSearch() {
  const q = document.getElementById('q'); if (!q) return;
  q.addEventListener('input', function () {
    clearTimeout(qTimer);
    if (((q.value) || '').trim().length >= 2) loadSearch(LANG).then(runSearch);
    qTimer = setTimeout(runSearch, 120);
  });
  q.addEventListener('focus', function () { loadSearch(LANG); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { q.value = ''; runSearch(); q.blur(); }
    if (e.key === 'Enter') { const f = document.querySelector('#results .ritem'); if (f) f.click(); }
  });
  const clr = document.getElementById('qClear');
  if (clr) clr.addEventListener('click', function () { q.value = ''; runSearch(); q.focus(); });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.searchwrap')) document.getElementById('results').classList.remove('on');
  });
  addEventListener('keydown', function (e) {
    if ((e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) ||
        ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); q.focus(); }
  });
  const wrap = document.getElementById('searchWrapD');
  if (wrap && wrap.classList) {
    const place = function () { wrap.classList.toggle('mob', innerWidth <= 820); };
    place(); addEventListener('resize', place);
  }
}

let LANG='en';
try{
  const q=new URLSearchParams(location.search).get('lang'), sv=localStorage.getItem('amsPlanLang');
  LANG=(q==='es'||q==='en')?q:(sv||((navigator.language||'').toLowerCase().startsWith('es')?'es':'en'));
}catch(e){}
if(!CONTENT[LANG]) LANG='en';
document.getElementById('langSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  LANG=b.dataset.lang; try{localStorage.setItem('amsPlanLang',LANG);}catch(e){}
  render(LANG);
});
document.getElementById('printBtn').addEventListener('click',()=>window.print());
let _xpState=[];
window.addEventListener('beforeprint',()=>{ _xpState=[...document.querySelectorAll('details.xp')].map(d=>d.open); document.querySelectorAll('details.xp').forEach(d=>d.open=true); });
window.addEventListener('afterprint',()=>{ document.querySelectorAll('details.xp').forEach((d,i)=>d.open=_xpState[i]??false); });
const _pbar=document.getElementById('pbar');
addEventListener('scroll',()=>{ const h=document.documentElement; const m=h.scrollHeight-h.clientHeight; _pbar.style.width=(m>0?(h.scrollTop/m*100):0)+'%'; },{passive:true});
/* v24-hash */
function honorHash(){
  const id = decodeURIComponent((location.hash || '').slice(1));
  if(!id) return;
  const el = document.getElementById(id);
  if(!el) return;
  /* direct, not rAF: rAF does not fire in background tabs, which is exactly
     how a shared deep link is usually opened. Retry once after webfonts
     settle, since late layout shifts move the target. */
  el.scrollIntoView({block:'start'});
  setTimeout(() => { const e2 = document.getElementById(id); if(e2) e2.scrollIntoView({block:'start'}); }, 150);
}
render(LANG);
wireSearch();
honorHash();                         /* deep links (?lang=es#focus) land correctly */
addEventListener('hashchange', honorHash);
